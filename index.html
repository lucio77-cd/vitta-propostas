<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Vitta Propostas</title>
  <meta name="description" content="Crie propostas profissionais e colete assinaturas eletrônicas em minutos." />

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: "#f0fdfa", 100: "#ccfbf1", 500: "#14b8a6", 600: "#0d9488", 700: "#0f766e", 900: "#134e4a" }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Cabeçalho (oculto em telas públicas, ex.: assinatura) -->
  <header id="app-header" class="bg-brand-700 text-white sticky top-0 z-20 shadow">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="#/dashboard" class="font-bold text-lg tracking-tight">Vitta<span class="text-brand-100">Propostas</span></a>
      <div id="header-actions" class="flex items-center gap-3 text-sm"></div>
    </div>
  </header>

  <!-- Área onde as telas (views) são renderizadas -->
  <main id="app" class="flex-1 w-full max-w-3xl mx-auto px-4 py-6" aria-live="polite">
    <div class="flex justify-center py-20"><div class="spinner"></div></div>
  </main>

  <!-- Toast global -->
  <div id="toast" class="toast" role="status"></div>

  <footer id="app-footer" class="text-center text-xs text-slate-400 py-4">
    © <span id="year"></span> Vitta Propostas
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>

  <!-- Ponto de entrada em módulo ES6 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
